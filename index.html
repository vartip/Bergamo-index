<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betcore - Football & FIFA Predictions</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131d31;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --tab-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --vip-gold: #f59e0b;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .balance-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #0b0f19;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .deposit-trigger-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .deposit-trigger-btn:active {
            transform: scale(0.9);
        }

        .top-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--tab-bg);
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #000000;
            border-color: var(--accent-color);
        }

        .filter-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .filter-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .filter-options {
            display: flex;
            gap: 6px;
        }

        .filter-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: #000000;
        }

        .prediction-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .prediction-card.locked {
            border-color: var(--vip-gold);
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge-category {
            background-color: #27272a;
            color: #facc15;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid #3f3f46;
        }

        .match-time {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.pending {
            background-color: #b45309;
            color: #fef3c7;
        }

        .status-badge.won {
            background-color: #059669;
            color: #ffffff;
        }

        .status-badge.lost {
            background-color: #dc2626;
            color: #ffffff;
        }

        .team-section {
            background-color: #0b0f19;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid #1e293b;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .vs-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .tip-odds-box {
            background-color: #0b0f19;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e293b;
        }

        .tip-title-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .tip-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .odds-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        .lock-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(11, 15, 25, 0.95);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px dashed var(--vip-gold);
            gap: 10px;
        }

        .lock-title {
            color: var(--vip-gold);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .unlock-btn {
            background-color: var(--vip-gold);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--vip-gold);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .vip-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--vip-gold);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            margin-bottom: 14px;
        }

        .vip-banner h3 {
            color: var(--vip-gold);
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .vip-banner p {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .deposit-btn {
            width: 100%;
            background-color: var(--vip-gold);
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .empty-state, .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header -->
        <div class="app-header">
            <div class="app-title">⚽ Betcore</div>
            <div class="balance-badge">
                <span>Bal: <b id="user-balance-display" style="color: var(--accent-color);">0$</b></span>
                <button class="deposit-trigger-btn" onclick="openDepositModal()" title="Deposit">+</button>
            </div>
        </div>

        <!-- Top Navigation Tabs -->
        <div class="top-tabs">
            <button class="tab-btn active" onclick="switchTab('free', this)">🎁 Free Tips</button>
            <button class="tab-btn" onclick="switchTab('vip', this)">👑 VIP Tips</button>
            <button class="tab-btn" onclick="switchTab('history', this)">🕒 History</button>
        </div>

        <!-- Filter Game Type Section -->
        <div class="filter-section" id="filter-box">
            <span class="filter-label">Filter Game Type:</span>
            <div class="filter-options">
                <button class="filter-btn active" onclick="filterGame('all', this)">All</button>
                <button class="filter-btn" onclick="filterGame('Football', this)">⚽ Football</button>
                <button class="filter-btn" onclick="filterGame('FIFA', this)">🎮 FIFA</button>
            </div>
        </div>

        <!-- Main Dynamic Content Container -->
        <div id="predictions-container">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- Deposit Modal Popup -->
    <div class="modal-overlay" id="depositModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeDepositModal()">&times;</button>
            <div class="vip-banner">
                <h3>👑 Deposit & Unlock VIP</h3>
                <p>If your balance is insufficient, please deposit via USDT to top up your account.</p>
            </div>
            
            <form id="deposit-form" onsubmit="submitDepositToBot(event)">
                <div class="form-group">
                    <label>Select Country / Region</label>
                    <select id="country-select" class="form-control" onchange="onCountryChange()" required>
                        <option value="" disabled selected>-- Choose Country --</option>
                        <option value="USA">United States</option>
                        <option value="UK">United Kingdom</option>
                        <option value="Canada">Canada</option>
                        <option value="Other">Other International</option>
                    </select>
                </div>

                <div id="payment-info-box" style="display: none; background: #0b0f19; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 0.85rem; border: 1px solid var(--border-color);"></div>

                <div class="form-group" id="txn-group" style="display: none;">
                    <label>Enter Transaction ID / Hash</label>
                    <input type="text" id="txn_id" class="form-control" placeholder="e.g. 0x1234...abcd">
                </div>

                <div class="form-group" id="screenshot-group" style="display: none;">
                    <label>Upload Payment Screenshot (Receipt)</label>
                    <input type="file" id="screenshot_file" class="form-control" accept="image/*">
                </div>

                <button type="submit" id="deposit-action-btn" class="deposit-btn" style="display: none;">Deposit via Telegram Bot</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://quapmqfbqzymuojyynfz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1YXBtcWZicXp5bXVvanl5bmZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODA2NzQsImV4cCI6MjEwMjM1NjY3NH0.cW84CzyobS4v5BcpgseFkagAwa7x6BCIyXPfUWMJaVY';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentTab = 'free';
        let currentGameType = 'all';
        let allPredictions = [];
        
        let userBalance = 0; 
        let unlockedPicks = []; 
        let unlockedAllVip = false;
        let currentUserTelegramId = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const tgUser = tg.initDataUnsafe?.user;
            currentUserTelegramId = tgUser ? tgUser.id : Math.floor(Math.random() * 1000000); 
            const username = tgUser ? (tgUser.username || tgUser.first_name) : 'BrowserUser';

            await syncUserWithDatabase(currentUserTelegramId, username);
            await fetchPredictions();
        });

        async function syncUserWithDatabase(telegramId, username) {
            try {
                let { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('telegram_id', telegramId)
                    .maybeSingle();

                if (data) {
                    userBalance = data.balance !== undefined ? data.balance : 0;
                } else {
                    const { error: insertError } = await supabaseClient
                        .from('users')
                        .insert([{ telegram_id: telegramId, username: username, balance: 0 }]);
                    
                    if (insertError) console.error('Error inserting user:', insertError);
                    userBalance = 0;
                }

                document.getElementById('user-balance-display').innerText = userBalance + '$';
            } catch (err) {
                console.error('Error syncing user:', err);
                document.getElementById('user-balance-display').innerText = '0$';
            }
        }

        async function fetchPredictions() {
            try {
                let { data, error } = await supabaseClient
                    .from('predictions')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allPredictions = data || [];
                renderPredictions();

            } catch (err) {
                console.error("Error fetching data:", err);
                document.getElementById('predictions-container').innerHTML = `<div class="empty-state">Failed to load data.</div>`;
            }
        }

        function switchTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            renderPredictions();
        }

        function filterGame(gameType, element) {
            currentGameType = gameType;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            renderPredictions();
        }

        function openDepositModal() {
            document.getElementById('depositModal').style.display = 'flex';
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function closeDepositModal() {
            document.getElementById('depositModal').style.display = 'none';
        }

        function onCountryChange() {
            const country = document.getElementById('country-select').value;
            const infoBox = document.getElementById('payment-info-box');
            const txnGroup = document.getElementById('txn-group');
            const screenshotGroup = document.getElementById('screenshot-group');
            const actionBtn = document.getElementById('deposit-action-btn');

            infoBox.style.display = 'block';
            txnGroup.style.display = 'block';
            screenshotGroup.style.display = 'block';
            actionBtn.style.display = 'block';

            infoBox.innerHTML = `
                <span style="color: var(--text-muted);">Payment Currency:</span> <b style="color: var(--vip-gold);">USD (BEP20 Network - USDT)</b><br>
                <span style="color: var(--text-muted);">Wallet Address:</span> <b style="color: var(--accent-color);">0x5C6e8079854d5844434894D37b98A277F33Da5fF</b>
            `;
        }

        function submitDepositToBot(event) {
            event.preventDefault();
            const country = document.getElementById('country-select').value;
            const txnId = document.getElementById('txn_id').value;
            
            if (!country || !txnId) {
                alert('Please fill in all information.');
                return;
            }

            const depositData = {
                country: country,
                payment_method: 'USD (BEP20)',
                txn_id: txnId,
                user_id: currentUserTelegramId,
                username: tg.initDataUnsafe?.user?.username || 'unknown'
            };

            if (tg.sendData) {
                tg.sendData(JSON.stringify(depositData));
                tg.close();
            } else {
                alert(`Deposit request (ID: ${txnId}) sent successfully.`);
                closeDepositModal();
            }
        }

        async function unlockPick(index, price) {
            if (userBalance >= price) {
                userBalance -= price;
                unlockedPicks.push(index);
                
                document.getElementById('user-balance-display').innerText = userBalance + '$';
                await updateUserBalanceInDB(userBalance);

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                renderPredictions();
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                alert('⚠️ Insufficient balance! Please deposit.');
                openDepositModal();
            }
        }

        async function unlockAllVip() {
            if (userBalance >= 20) {
                userBalance -= 20;
                unlockedAllVip = true;
                
                document.getElementById('user-balance-display').innerText = userBalance + '$';
                await updateUserBalanceInDB(userBalance);

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                renderPredictions();
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                alert('⚠️ You need $20 to unlock all VIP picks. Please deposit!');
                openDepositModal();
            }
        }

        async function updateUserBalanceInDB(newBalance) {
            try {
                const { error } = await supabaseClient
                    .from('users')
                    .update({ balance: newBalance })
                    .eq('telegram_id', currentUserTelegramId);

                if (error) {
                    console.error('Error updating balance in DB:', error);
                }
            } catch (err) {
                console.error('Exception updating balance:', err);
            }
        }

        function renderPredictions() {
            const container = document.getElementById('predictions-container');

            let filtered = allPredictions.filter((item, index) => {
                let matchesTab = true;
                const tour = (item.tournament || '').toLowerCase();
                const status = (item.status || 'PENDING').toUpperCase();

                if (status === 'WON' || status === 'LOST') {
                    if (currentTab === 'free' || currentTab === 'vip') {
                        return false; 
                    }
                }

                if (currentTab === 'free') {
                    matchesTab = tour.includes('free') && status === 'PENDING';
                } else if (currentTab === 'vip') {
                    matchesTab = tour.includes('vip') && status === 'PENDING';
                } else if (currentTab === 'history') {
                    matchesTab = status === 'WON' || status === 'LOST';
                }

                let matchesGame = (currentGameType === 'all') || tour.includes(currentGameType.toLowerCase());
                
                return matchesTab && matchesGame;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">No predictions found for this section.</div>`;
                return;
            }

            container.innerHTML = '';
            
            if (currentTab === 'vip' && !unlockedAllVip) {
                const allVipBanner = document.createElement('div');
                allVipBanner.style.cssText = "background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--vip-gold); border-radius: 14px; padding: 14px; text-align: center; margin-bottom: 16px;";
                allVipBanner.innerHTML = `
                    <h3 style="color: var(--vip-gold); font-size: 1rem; margin-bottom: 6px;">👑 Unlock All VIP Picks</h3>
                    <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 10px;">Unlock all VIP picks for today for $20!</p>
                    <button onclick="unlockAllVip()" style="background-color: var(--vip-gold); color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">Unlock All ($20)</button>
                `;
                container.appendChild(allVipBanner);
            }

            filtered.forEach((match, originalIndex) => {
                const card = document.createElement('div');
                card.className = 'prediction-card';

                const isVipTab = (currentTab === 'vip');
                const isUnlocked = unlockedAllVip || unlockedPicks.includes(originalIndex);
                const statusVal = (match.status || 'PENDING').toUpperCase();

                const matchPrice = match.price !== undefined && match.price !== null ? match.price : 5;

                if (isVipTab && !isUnlocked) {
                    card.classList.add('locked');
                    card.innerHTML = `
                        <div class="card-top-row">
                            <span class="badge-category">🔒 VIP Locked Match</span>
                            <span class="match-time">${match.match_time || 'N/A'}</span>
                        </div>
                        <div class="lock-overlay">
                            <span style="font-size: 1.5rem;">🔒</span>
                            <div class="lock-title">${match.match_title || 'VIP Locked Fixture'}</div>
                            <p style="color: var(--text-muted); font-size: 0.75rem;">Unlock this pick for $${matchPrice}</p>
                            <button class="unlock-btn" onclick="unlockPick(${originalIndex}, ${matchPrice})">Unlock Pick ($${matchPrice})</button>
                        </div>
                    `;
                } else {
                    let statusClass = 'pending';
                    if (statusVal === 'WON') statusClass = 'won';
                    if (statusVal === 'LOST') statusClass = 'lost';

                    card.innerHTML = `
                        <div class="card-top-row">
                            <span class="badge-category">${match.tournament || 'Football Tip'}</span>
                            <span class="match-time">${match.match_time || 'N/A'}</span>
                            <span class="status-badge ${statusClass}">${statusVal}</span>
                        </div>
                        <div class="team-section">
                            <span class="team-name">${match.match_title ? match.match_title.split(' vs ')[0] : 'Team A'}</span>
                            <span class="vs-text">vs</span>
                            <span class="team-name">${match.match_title ? match.match_title.split(' vs ')[1] : 'Team B'}</span>
                        </div>
                        <div class="tip-odds-box">
                            <div>
                                <div class="tip-title-label">Prediction Tip</div>
                                <div class="tip-value">${match.prediction || 'N/A'}</div>
                            </div>
                            <div>
                                <div class="tip-title-label" style="text-align: right;">Odds</div>
                                <div class="odds-value">@${match.odds || '1.85'}</div>
                            </div>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
